services:
  dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  preview:
    build:
      context: .
      target: runtime
    ports:
      - "8086:80"
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.portfolio_local.entrypoints=web"
      - "traefik.http.routers.portfolio_local.rule=Host(`portfolio.jpf.localhost`)"

volumes:
  node_modules:

networks:
  web:
    external: true
